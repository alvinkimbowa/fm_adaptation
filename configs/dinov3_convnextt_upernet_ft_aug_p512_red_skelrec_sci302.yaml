data:
  raw_data_dir: ../../../GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset302_neurite_yvonne_b2_smi_1px
  test_datasets:
    - Dataset302_neurite_yvonne_b2_smi_1px
    - Dataset300_neurite_yvonne_smi
    - Dataset301_neurite_yvonne_b2_smi
    - Dataset303_neurite_yvonne_in_vitro_smi
  test_split: all
  fold: 0
  augment:
    hflip: true
    vflip: true
    rotation: 180
    flip_p: 0.5

model:
  name: dinov3
  probe: upernet
  variant: convnextt
  injector: false
  train_encoder: true
  run_name: convnextt_upernet_ft_aug_p512_red_skelrec_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.01
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  # Dice + cross entropy + w * skeleton recall, at the weight the reference implementation ships
  # with. The skeleton is taken from the annotation, so the term costs a skeletonisation per patch
  # and no gradient -- see `losses.tubed_skeleton`.
  skeleton_recall_weight: 1.0
  seed: 0
  device: cuda

patching:
  enabled: true
  patch_size: 512
  patches_per_case: 16
  min_roi_fraction: 0.05
  overlap: 0.5
  respect_channels: true
