data:
  raw_data_dir: ../nmus_segmentation/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset701_nmus_median_rgb
  test_datasets:
    - Dataset701_nmus_median_rgb
  test_split: Ts
  fold: 0
  # Flips, rotation and zoom, on the square canvas the encoder sees. A rotation is cropped back to
  # what is real image in every row and column, so nothing invented reaches the model. No vertical
  # flip: a transverse nerve scan has an up, with the skin surface along the top edge.
  augment:
    hflip: true
    vflip: false
    rotation: 45
    zoom_min: 0.5
    zoom_max: 1.5

  # The control for the prompted runs: the same gates, fed a prompt that tells them nothing.
  # Every case in this dataset carries `anatomy: median`, so a one-entry vocabulary keyed on it gives
  # every case the same index in every subset -- one constant embedding, never the null one, and no
  # location anywhere in the run. Keying on `location` instead would leave validation and test using
  # embeddings that training never updated.
  prompt:
    key: anatomy
    vocabulary:
      - median
    width: 256
    sites: encoder
    dropout_p: 0.0

model:
  name: dinov3
  probe: upernet
  variant: convnexts
  injector: false
  train_encoder: true
  run_name: convnexts_upernet_ft_aug_gateonly_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
