data:
  raw_data_dir: ../../../GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  # Resolve the final Dataset304_* directory name from its stable nnU-Net dataset id.
  train_dataset: 304
  test_datasets:
    - 304
    - 300
    - 301
    - 302
    - 303
  test_split: all
  fold: 0
  augment:
    hflip: true
    vflip: true
    rotation: 180
    flip_p: 0.5

model:
  name: dinov3
  probe: upernet
  # ConvNeXt's four stages are the feature pyramid UperNet wants, so no injector is needed.
  variant: convnextt
  injector: false
  train_encoder: true
  run_name: convnextt_upernet_ft_aug_p512_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.01
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  seed: 0
  device: cuda

# Whole slides are trained and predicted at native resolution. A 512px patch reaches ConvNeXt
# unscaled; `augment` above deliberately leaves zoom_min/zoom_max at their 1.0 defaults.
patching:
  enabled: true
  patch_size: 512
  patches_per_case: 16
  min_roi_fraction: 0.05
  overlap: 0.5
