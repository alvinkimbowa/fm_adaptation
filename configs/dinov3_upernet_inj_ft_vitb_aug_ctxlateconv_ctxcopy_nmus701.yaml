data:
  raw_data_dir: ../nmus_segmentation/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset701_nmus_median_rgb
  test_datasets:
    - Dataset701_nmus_median_rgb
  test_split: Ts
  fold: 0
  # Flips, rotation and zoom, on the square canvas the encoder sees. A rotation is cropped back to
  # what is real image in every row and column, so nothing invented reaches the model. No vertical
  # flip: a transverse nerve scan has an up, with the skin surface along the top edge.
  augment:
    hflip: true
    vflip: false
    rotation: 45
    zoom_min: 0.5
    zoom_max: 1.5
  # The context fusion of the coarsest pyramid level, by concatenation and convolution, with the
  # case's own frame standing in for each of its six context frames.
  context:
    per_side: 3
    stride: 2
    fusion: late
    operator: conv
    gradient: true
    copies: true

model:
  name: dinov3
  probe: upernet
  injector: true
  # ViT-B/16 instead of the default ViT-L/16; the smaller trunk is what this run tests.
  variant: vitb16
  train_encoder: true
  run_name: upernet_inj_ft_vitb_aug_ctxlateconv_ctxcopy_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 8
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
