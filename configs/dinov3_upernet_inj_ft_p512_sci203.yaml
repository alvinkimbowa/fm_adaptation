data:
  raw_data_dir: ../../../GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset203_neurites_yvonne_smi_2px_scaleaug
  test_datasets:
    - Dataset203_neurites_yvonne_smi_2px_scaleaug
  test_split: all
  fold: 0

model:
  name: dinov3
  probe: upernet
  injector: true
  train_encoder: true
  run_name: upernet_inj_ft_p512_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda

# Whole slides are far too large to resize to the encoder's input; train and predict on patches cut
# at native resolution. A 512 patch is upsampled to the encoder's 896, and its probabilities come
# back down to 512 before the overlapping patches are accumulated.
patching:
  enabled: true
  patch_size: 512
  patches_per_case: 16
  min_roi_fraction: 0.05
  overlap: 0.5
