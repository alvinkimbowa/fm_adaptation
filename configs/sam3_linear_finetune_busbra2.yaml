data:
  raw_data_dir: ../monounetv2/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset082_BUSBRA_Toshiba_Aplio_300
  test_datasets:
    - Dataset080_BUSBRA_GE_Logiq_5
    - Dataset081_BUSBRA_GE_Logiq_7
    - Dataset082_BUSBRA_Toshiba_Aplio_300
    - Dataset083_BUSBRA_U_Systems
  test_split: Tr
  fold: 0

model:
  name: sam3
  probe: linear
  run_name: linear_finetune
  train_encoder: true
  init_from: linear
  checkpoint: null

training:
  epochs: 20
  min_epochs: 5
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001
  batch_size: 1
  encoder_batch_size: 1
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  seed: 0
  device: cuda
  encoder_learning_rate: 0.00001
  accumulation_steps: 8
