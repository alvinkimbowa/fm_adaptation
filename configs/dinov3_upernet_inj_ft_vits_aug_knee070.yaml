data:
  raw_data_dir: ../knee_us_segmentation/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset070_Clarius_L15
  test_datasets:
    - Dataset070_Clarius_L15
    - Dataset071_Sonix-Touch
    - Dataset072_GE_LQP9
    - Dataset073_GE_LE
  test_split: all
  fold: 0
  # Flips, rotation and zoom, on the square canvas the encoder sees. A rotation is cropped back to
  # what is real image in every row and column, so nothing invented reaches the model; on a section
  # this close to square that crop still leaves most of the knee. A zoom that would carry the
  # annotation off the canvas is reduced until it fits. No vertical flip: a knee section has an up.
  augment:
    hflip: true
    vflip: false
    rotation: 45
    zoom_min: 0.5
    zoom_max: 1.5

model:
  name: dinov3
  probe: upernet
  injector: true
  # ViT-S/16 instead of the default ViT-L/16; the smaller trunk is what this run tests.
  variant: vits16
  train_encoder: true
  run_name: upernet_inj_ft_vits_aug_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 8
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
