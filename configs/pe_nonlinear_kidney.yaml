data:
  raw_data_dir: ../monounetv2/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset084_KidneyUS_Philips
  test_datasets:
    - Dataset084_KidneyUS_Philips
    - Dataset085_KidneyUS_Other_Devices
  test_split: Tr
  fold: 0

model:
  name: pe
  probe: nonlinear
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 8
  encoder_batch_size: 8
  num_workers: 4
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 0
  device: cuda
