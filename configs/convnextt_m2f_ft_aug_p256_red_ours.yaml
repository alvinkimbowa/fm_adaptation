data:
  raw_data_dir: ../../../GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset301_neurite_yvonne_b2_smi
  test_datasets:
  - Dataset301_neurite_yvonne_b2_smi
  test_split: Ts
  fold: 0
  augment:
    hflip: true
    vflip: true
    rotation: 180
    flip_p: 0.5
  stains:
  - SMI
  balance_sources: false
  instance_data_dir: data/instances_yvonne_b2
model:
  name: dinov3
  probe: mask2former
  variant: convnextt
  injector: false
  train_encoder: true
  run_name: convnextt_m2f_ft_aug_p256_red_ours
  checkpoint: null
  task: instance
  input_size: 256
  num_queries: 128
training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  encoder_learning_rate: 1.0e-05
  encoder_layer_decay: 1.0
  seed: 0
  device: cuda
  lr_schedule: poly
  gradient_clip: 1.0
  accumulation_steps: 1
patching:
  enabled: true
  patch_size: 256
  patches_per_case: 64
  min_roi_fraction: 0.05
  overlap: 0.5
  respect_channels: true
