data:
  raw_data_dir: /home/ultrai/GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset203_neurites_yvonne_smi_2px_scaleaug
  test_datasets:
    - Dataset203_neurites_yvonne_smi_2px_scaleaug
    - Dataset300_neurite_yvonne_smi
  test_split: all
  fold: 0

model:
  name: sam3
  probe: linear
  run_name: linear_finetune
  checkpoint: null

training:
  epochs: 20
  min_epochs: 5
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001
  batch_size: 1
  encoder_batch_size: 1
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  seed: 0
  device: cuda

finetuning:
  initial_probe: linear
  encoder_learning_rate: 0.00001
  accumulation_steps: 8

# Whole slides are far too large to resize to 1008; train and predict on native-resolution patches.
patching:
  enabled: true
  patch_size: 1008
  patches_per_case: 16
  min_roi_fraction: 0.05
  overlap: 0.5
