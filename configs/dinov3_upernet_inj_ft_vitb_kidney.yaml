data:
  raw_data_dir: ../monounetv2/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset084_KidneyUS_Philips
  test_datasets:
    - Dataset084_KidneyUS_Philips
    - Dataset085_KidneyUS_Other_Devices
  test_split: Tr
  fold: 0

model:
  name: dinov3
  probe: upernet
  injector: true
  # ViT-B/16, the trunk size that puts the whole model in nnU-Net's parameter range.
  variant: vitb16
  train_encoder: true
  run_name: upernet_inj_ft_vitb_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
