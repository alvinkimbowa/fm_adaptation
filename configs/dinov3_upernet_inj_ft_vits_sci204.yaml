data:
  raw_data_dir: /home/ultrai/GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset204_lesion_mohammad_eric_gfap
  test_datasets:
    - Dataset204_lesion_mohammad_eric_gfap
    - Dataset207_lesion_katie_contusion_smi_gfap
    - Dataset214_lesion_mohammad_smi_gfap
    - Dataset215_lesion_yvonne_smi_gfap
    - Dataset218_lesion_eric_smi_gfap
  test_split: all
  fold: 0

model:
  name: dinov3
  probe: upernet
  injector: true
  # ViT-S/16 instead of the default ViT-L/16; the smaller trunk is what this run tests.
  variant: vits16
  train_encoder: true
  run_name: upernet_inj_ft_vits_ours
  # Null uses SAM3's official Hugging Face download and local cache.
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 4
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
