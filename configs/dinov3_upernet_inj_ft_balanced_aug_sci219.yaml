data:
  raw_data_dir: ../../../GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  # MYKE without Eric: the complement of the Eric-alone run, so the pair says how much of MYKE's
  # score is Eric's 62 cases and how much is everyone else's 78.
  train_dataset: Dataset219_lesion_MYK_smi_gfap
  test_datasets:
    - Dataset219_lesion_MYK_smi_gfap
    - Dataset218_lesion_eric_smi_gfap
    - Dataset207_lesion_katie_contusion_smi_gfap
    - Dataset210_lesion_interrater_MY_smi_gfap
    - Dataset211_lesion_paul_widefield_smi_gfap
    - Dataset212_lesion_katie_dorsal_column_smi_gfap
    - Dataset214_lesion_mohammad_smi_gfap
    - Dataset215_lesion_yvonne_smi_gfap
  # An evaluation set's own split boundary means nothing to a model that never trained on it, so
  # `all` scores every case of each.
  test_split: all
  fold: 0
  # The same recipe as the MYKE augmented run, so the two differ only in whether Eric is present.
  augment:
    hflip: true
    vflip: true
    rotation: 10
    zoom_min: 0.5
    zoom_max: 1.5
  balance_sources: true

model:
  name: dinov3
  probe: upernet
  injector: true
  train_encoder: true
  run_name: upernet_inj_ft_balanced_aug_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
