data:
  raw_data_dir: ../monounetv2/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset086_MMOTU_2D
  test_datasets:
    - Dataset086_MMOTU_2D
    - Dataset087_MMOTU_CEUS
  test_split: Tr
  fold: 0

model:
  name: sam3
  probe: nonlinear
  run_name: nonlinear_finetune
  checkpoint: null

training:
  epochs: 20
  min_epochs: 5
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001
  batch_size: 1
  encoder_batch_size: 1
  num_workers: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  seed: 0
  device: cuda

finetuning:
  initial_probe: nonlinear
  encoder_learning_rate: 0.00001
  accumulation_steps: 8
