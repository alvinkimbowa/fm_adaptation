data:
  raw_data_dir: ../monounetv2/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset090_Echo_EchoCP
  # Echo is six-class, and 089 and 093 share its label indices, so the same head transfers to them.
  test_datasets:
    - Dataset090_Echo_EchoCP
    - Dataset089_Echo_CardiacUDA
    - Dataset093_Echo_CardiacNet
  test_split: Tr
  fold: 0

model:
  name: dinov3
  probe: upernet
  injector: true
  train_encoder: true
  run_name: upernet_inj_ft_ours
  # Null uses SAM3's official Hugging Face download and local cache.
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 8
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
