data:
  raw_data_dir: ../../../GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  train_dataset: Dataset203_neurites_yvonne_smi_2px_scaleaug
  test_datasets:
    - Dataset203_neurites_yvonne_smi_2px_scaleaug
  test_split: all
  fold: 0

model:
  name: dinov3
  probe: upernet
  # ConvNeXt's four stages are the feature pyramid UperNet wants, so there is no adapter to inject into.
  variant: convnextl
  injector: false
  train_encoder: true
  # Start from the frozen ConvNeXt head rather than a random one, as `LP + FT` does. `best`
  # rather than `final`: the frozen run early-stopped on a downswing, so its last epoch is not
  # its best head.
  init_from: convnext_upernet_p512_ours
  init_from_checkpoint: best
  run_name: convnext_upernet_ft_init_p512_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda

# Whole slides are far too large to resize to the encoder's input; train and predict on patches cut
# at native resolution. 512 is the resolution ConvNeXt segments at, so a patch reaches it unscaled.
patching:
  enabled: true
  patch_size: 512
  patches_per_case: 16
  min_roi_fraction: 0.05
  overlap: 0.5
