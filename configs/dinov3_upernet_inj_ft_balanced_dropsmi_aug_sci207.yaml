data:
  raw_data_dir: ../../../GAA/spinal_cord_injury/data/nnUNet_raw
  results_dir: models
  # Katie's contusion sections alone, 52 cases from one annotator.
  train_dataset: Dataset207_lesion_katie_contusion_smi_gfap
  test_datasets:
    - Dataset207_lesion_katie_contusion_smi_gfap
    - Dataset218_lesion_eric_smi_gfap
    - Dataset210_lesion_interrater_MY_smi_gfap
    - Dataset211_lesion_paul_widefield_smi_gfap
    - Dataset212_lesion_katie_dorsal_column_smi_gfap
    - Dataset214_lesion_mohammad_smi_gfap
    - Dataset215_lesion_yvonne_smi_gfap
  # Datasets 208 and 219 are left out: both contain these same 52 cases, so scoring against them
  # would report training data as transfer.
  test_split: all
  fold: 0
  augment:
    hflip: true
    vflip: true
    rotation: 10
    zoom_min: 0.5
    zoom_max: 1.5
  # Every case comes from one annotator, so this weights them exactly as plain shuffling does. Kept
  # so the run is named and configured like the MYK pair it is read beside, not because it does
  # anything here.
  balance_sources: true
  # All 52 cases carry both stains and Eric, the transfer target, carries only GFAP. Dropping SMI
  # half the time is what lets this run meet Eric's condition at training time.
  channel_dropout:
    - SMI

model:
  name: dinov3
  probe: upernet
  injector: true
  train_encoder: true
  run_name: upernet_inj_ft_balanced_dropsmi_aug_ours
  checkpoint: null

training:
  epochs: 100
  min_epochs: 20
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  batch_size: 2
  encoder_batch_size: 4
  num_workers: 4
  learning_rate: 0.001
  encoder_learning_rate: 0.00001
  encoder_layer_decay: 0.9
  weight_decay: 0.01
  seed: 0
  device: cuda
